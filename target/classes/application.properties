# ===========================
# Database Configuration (Windows Authentication)
# ===========================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=thebooks;encrypt=false;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Custom Naming Strategy (nếu dùng)
spring.jpa.hibernate.naming.physical-strategy=com.example.bookreading.config.CustomPhysicalNamingStrategy

spring.jpa.open-in-view=false

# ===========================
# Server Configuration
# ===========================
server.port=8080

# ===========================
# Static Resources
# ===========================
spring.web.resources.static-locations=classpath:/static/,file:./

# ===========================
# SQL Initialization
# ===========================
spring.sql.init.mode=never
