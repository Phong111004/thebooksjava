<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Đọc sách - Website Đọc Sách</title>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="logo-title">
                <a href="index.html" class="logo">
                    <img src="images/logo.png" alt="Books Logo">
                </a>
                <div class="title-section">
                    <h1><a href="index.html" style="color: white; text-decoration: none;">Website Đọc Sách</a></h1>
                    <span class="slogan">Khám phá thế giới tri thức</span>
                </div>
            </div>
            <div class="user-actions">
                <a href="login.html" class="btn-login">Đăng nhập</a>
                <a href="register.html" class="btn-register">Đăng ký</a>
            </div>
        </div>
    </header>

    <main id="read-main">
        <div id="reading-container" class="reading-container">
            <p class="loading-message">Đang tải nội dung sách...</p>
        </div>
    </main>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        function updateUserHeader() {
            const user = JSON.parse(localStorage.getItem('user'));
            const userActionsDiv = document.querySelector('.user-actions');

            if (user && userActionsDiv) {
                userActionsDiv.innerHTML = `
                    <div class="user-info">
                        <span class="user-greeting">Xin chào, <strong>${user.username}</strong>!</span>
                        <button id="logout-button" class="btn-logout">Đăng xuất</button>
                    </div>
                `;
                document.getElementById('logout-button').addEventListener('click', () => {
                    localStorage.removeItem('user');
                    window.location.href = 'index.html';
                });
            }
        }

        function getBookIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        async function fetchBookContent() {
            const bookId = getBookIdFromUrl();
            const container = document.getElementById('reading-container');

            if (!bookId) {
                container.innerHTML = '<p class="error-message">Không tìm thấy ID sách.</p>';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/books/${bookId}`);
                if (!response.ok) {
                    throw new Error(`Lỗi server: ${response.status}`);
                }
                const book = await response.json();

                // Cập nhật tiêu đề trang với tên sách
                document.title = `Đọc: ${book.title}`;

                // Kiểm tra xem sách có đường dẫn PDF không
                if (book.pdfPath) {
                    // Nhúng PDF vào trang bằng iframe
                    container.innerHTML = `<iframe src="${book.pdfPath}" width="100%" height="100%" style="border: none;"></iframe>`;
                    // Xóa padding và các style căn giữa để iframe chiếm toàn bộ không gian
                    container.style.padding = '0';
                    container.style.alignItems = 'stretch';
                    container.style.justifyContent = 'stretch';
                } else {
                    // Nếu không có pdfPath, hiển thị thông báo
                    container.innerHTML = '<p class="error-message">Nội dung của sách này chưa có sẵn.</p>';
                }
            } catch (error) {
                console.error('Lỗi khi tải nội dung sách:', error);
                container.innerHTML = '<p class="error-message">Đã xảy ra lỗi khi tải nội dung sách.</p>';
            }
        }

        updateUserHeader();
        fetchBookContent();
    </script>
</body>
</html>
